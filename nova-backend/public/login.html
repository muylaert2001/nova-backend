<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AVA Login</title>
<style>
body{background:#020b18;color:#d4e4f7;font-family:system-ui;height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.box{background:#061428;border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:30px;width:300px;text-align:center}
h1{color:#e8c870;letter-spacing:.2em;font-size:20px;margin-bottom:20px}
input{width:100%;padding:10px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.3);border-radius:6px;color:#d4e4f7;font-size:14px;margin-bottom:12px;box-sizing:border-box}
button{width:100%;padding:10px;background:rgba(201,168,76,.2);border:1px solid #c9a84c;border-radius:6px;color:#e8c870;font-size:14px;cursor:pointer}
button:hover{background:rgba(201,168,76,.3)}
#msg{color:#f87171;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h1>A V A</h1>
<input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')login()"/>
<button onclick="login()">LOGIN</button>
<div id="msg"></div>
</div>
<script>
async function login(){
  var pw = document.getElementById('pw').value;
  var res = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pw}), credentials: 'include'});
  var data = await res.json();
  if(data.success){ window.location.href = '/ava'; }
  else { document.getElementById('msg').textContent = 'Incorrect password'; }
}
</script>
</body>
</html>
